<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form action="/" method="post">
        <input type="text" name="nome" placeholder="Digite o seu nome de usuario.">
        <input type="password" name="senha" placeholder="Digite a sua senha de usuario">
        <button type="submit">Logue aqui</button>
        <a href="{{  url_for('cadastro')  }}">Não tem conta? Cadastre aqui</a>
    </form>
    {% if erro %}
    <p>{{ erro }}</p>
    {% endif %}
</body>
</html>
